<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>チャンネル診断レポート｜PDY ENTERTAINMENT</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../style.css">
  <script src="../script.js" defer></script>
  <style>
    /* レポート本文は見本PDFと同じ白地。サイトのヘッダ／フッタだけ紺のまま */
    body { background: #ffffff; }
    .report-shell { max-width: 900px; margin: 0 auto; padding: 88px 0 64px; background: #ffffff; }
    .report-shell .report-loading, .report-shell .report-error { padding: 40px 16px; color: #3a4560; line-height: 1.8; }
    .report-shell .report-error a { color: #d63b2f; }
    #report-body { min-height: 40vh; }
    .report-progress { margin: 0 16px 12px; padding: 14px 16px; border: 1px solid #e3e7f0; border-left: 4px solid #d63b2f; background: #f7f8fb; color: #1b2140; font-size: 15px; line-height: 1.6; }
    .report-progress small { color: #5a6580; }
    .report-bar { position: relative; height: 10px; margin: 10px 0 6px; background: #e3e7f0; border-radius: 6px; overflow: hidden; }
    .report-bar > span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #d63b2f, #f0715f); border-radius: 6px; transition: width .8s ease; }
    .report-eta { display: flex; justify-content: space-between; font-size: 13px; color: #5a6580; }
    .report-steps { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .report-steps span { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #eef1f7; color: #7a859d; }
    .report-steps span.on { background: #d63b2f; color: #fff; }
    .report-steps span.ok { background: #1b2140; color: #fff; }
    .report-progress-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #d63b2f; margin-right: 8px; animation: report-pulse 1.2s ease-in-out infinite; }
    @keyframes report-pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .report-progress-dot { animation: none; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../" aria-label="PDY ENTERTAINMENT トップ"><span class="brand-mark">PDY<span class="brand-dot">.</span></span><span class="brand-caption">ENTERTAINMENT</span></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="navigation" hidden><span class="menu-label">MENU</span><span class="menu-lines" aria-hidden="true"></span></button>
    <nav id="navigation" class="navigation" aria-label="メインナビゲーション">
      <a href="../#about">ABOUT</a><a href="../#services">SERVICES</a><a href="../#works">WORKS</a><a href="../#company">COMPANY</a>
      <a class="button button-small" href="../#contact">チャンネル無料診断 <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main class="report-shell">
    <div id="report-body" aria-live="polite">
      <p class="report-loading">診断レポートを読み込んでいます…</p>
    </div>
  </main>
  <footer class="site-footer wrap"><a class="brand" href="../" aria-label="PDY ENTERTAINMENT トップ"><span class="brand-mark">PDY<span class="brand-dot">.</span></span><span class="brand-caption">ENTERTAINMENT</span></a><p>株式会社PDYエンタテインメント</p><small>© PDY ENTERTAINMENT</small></footer>
  <script>
    (() => {
      const WORKER = 'https://pdy-script-generator.pdytokyo.workers.dev';
      const box = document.querySelector('#report-body');
      const params = new URLSearchParams(location.search);
      const token = (params.get('t') || location.hash.replace(/^#/, '')).trim();
      const isNew = params.get('new') === '1';
      const STAGE_TEXT = { queued: '順番待ち中…', fetching: 'チャンネルの公開データを取得しています…', metrics: '数字を整理しました。弱点を分析しています…', picks: '弱点を特定しました。企画を作成しています…', plan: '企画ができました。絵コンテを描いています…', images: '仕上げ中…' };
      const fail = (msg) => { box.innerHTML = `<p class="report-error">${msg}<br><a href="../#contact">もう一度診断を依頼する</a>／お急ぎの方は <a href="mailto:pdytokyo@gmail.com">pdytokyo@gmail.com</a> へ。</p>`; };
      if (!/^[A-Za-z0-9_-]{8,128}$/.test(token)) { fail('レポートのアドレスが正しくありません。メールに記載のリンクをそのまま開いてください。'); return; }
      // 進捗バー: 段階ごとの到達率と、プラットフォーム別の見込み時間から残り秒数を出す
      const STAGES = ['queued', 'fetching', 'metrics', 'picks', 'plan', 'images', 'done'];
      const STAGE_PCT = { queued: 4, fetching: 15, metrics: 40, picks: 58, plan: 74, images: 92, done: 100 };
      const STEP_LABEL = { fetching: 'データ取得', metrics: '数字', picks: '弱点', plan: '企画', images: '絵コンテ' };
      const startedAt = Date.now();
      let bar = null, curStage = 'queued', shown = 0, expectedSec = 150, ticker = null;
      const fmtSec = (n) => n >= 60 ? `約${Math.ceil(n / 60)}分` : `約${Math.max(5, Math.round(n / 5) * 5)}秒`;
      const draw = () => {
        if (!bar) return;
        const idx = STAGES.indexOf(curStage);
        const target = STAGE_PCT[curStage] ?? 4;
        const next = STAGE_PCT[STAGES[Math.min(idx + 1, STAGES.length - 1)]] ?? 100;
        // 次の段階の手前までは時間で少しずつ進める（止まって見えないように）
        const elapsed = (Date.now() - startedAt) / 1000;
        const creep = Math.min(next - 3, target + (elapsed / expectedSec) * 100 * 0.6);
        shown = Math.max(shown, Math.min(curStage === 'done' ? 100 : creep, target < shown ? shown : Math.max(target, creep)));
        const pct = Math.round(Math.min(100, shown));
        const remain = Math.max(5, Math.round(expectedSec * (1 - pct / 100)));
        bar.querySelector('.report-bar > span').style.width = pct + '%';
        bar.querySelector('.report-eta').innerHTML = `<span>${STAGE_TEXT[curStage] || 'レポートを作成しています…'}</span><span>${pct}%・残り${fmtSec(remain)}</span>`;
        bar.querySelector('.report-steps').innerHTML = ['fetching', 'metrics', 'picks', 'plan', 'images'].map(k => `<span class="${STAGES.indexOf(k) < idx ? 'ok' : k === curStage ? 'on' : ''}">${STEP_LABEL[k]}</span>`).join('');
      };
      const setProgress = (stage) => {
        if (stage === 'done') { if (bar) bar.remove(); bar = null; if (ticker) clearInterval(ticker); return; }
        curStage = stage;
        const body = box.innerText || '';
        if (/対象:\s*YouTube/.test(body)) expectedSec = 100; else if (/対象:\s*Instagram/.test(body)) expectedSec = 170;
        if (!bar) {
          bar = document.createElement('div'); bar.className = 'report-progress';
          bar.innerHTML = `<div class="report-bar"><span></span></div><div class="report-eta"></div><div class="report-steps"></div><small>この画面のまま少しお待ちください。できた順に表示され、完成したらメールでも同じリンクが届きます。</small>`;
          box.parentNode.insertBefore(bar, box);
          ticker = setInterval(draw, 1000);
        }
        draw();
      };
      let notFoundCount = 0, timer = null;
      const load = async () => {
        try {
          const res = await fetch(`${WORKER}/diag/${encodeURIComponent(token)}?format=fragment`, { headers: { Accept: 'text/html' }, cache: 'no-store' });
          const stage = res.headers.get('X-Diag-Stage') || (res.ok ? 'done' : '');
          if (res.status === 404 || res.status === 410) {
            // 送信直後は数秒だけ保存待ちがある
            if (isNew && notFoundCount++ < 100) { setProgress('queued'); timer = setTimeout(load, 5000); return; }
            return fail('このレポートは見つからないか、公開期限（60日）を過ぎています。');
          }
          if (!res.ok) { if (isNew && notFoundCount++ < 100) { setProgress('queued'); timer = setTimeout(load, 5000); return; } return fail('レポートを読み込めませんでした。時間を置いてもう一度お試しください。'); }
          const html = await res.text();
          if (html.trim()) { box.innerHTML = html; }
          document.title = (box.querySelector('h1')?.textContent || 'チャンネル診断レポート') + '｜PDY ENTERTAINMENT';
          setProgress(stage);
          if (stage !== 'done') {
            // 画面を開いている間はブラウザ側から「次の段階へ」を頼み、サーバーの再開待ちを無くす（応答は段階完了まで待つ）
            try { await fetch(`${WORKER}/api/homepage/diagnosis/continue`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) }); } catch { /* 未対応・混雑時は通常のポーリングに任せる */ }
            timer = setTimeout(load, 1500);
          }
        } catch { if (isNew && notFoundCount++ < 100) { timer = setTimeout(load, 6000); return; } fail('通信エラーで読み込めませんでした。'); }
      };
      if (isNew) setProgress('queued');
      load();
    })();
  </script>
</body>
</html>
