<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>チャンネル診断レポート｜PDY ENTERTAINMENT</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../style.css">
  <script src="../script.js" defer></script>
  <style>
    /* レポート本文は見本PDFと同じ白地。サイトのヘッダ／フッタだけ紺のまま */
    body { background: #ffffff; }
    .report-shell { max-width: 900px; margin: 0 auto; padding: 88px 0 64px; background: #ffffff; }
    .report-shell .report-loading, .report-shell .report-error { padding: 40px 16px; color: #3a4560; line-height: 1.8; }
    .report-shell .report-error a { color: #d63b2f; }
    #report-body { min-height: 40vh; }
    .report-progress { margin: 0 16px 12px; padding: 14px 16px; border: 1px solid #e3e7f0; border-left: 4px solid #d63b2f; background: #f7f8fb; color: #1b2140; font-size: 15px; line-height: 1.6; }
    .report-progress small { color: #5a6580; }
    .report-progress-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #d63b2f; margin-right: 8px; animation: report-pulse 1.2s ease-in-out infinite; }
    @keyframes report-pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .report-progress-dot { animation: none; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../" aria-label="PDY ENTERTAINMENT トップ"><span class="brand-mark">PDY<span class="brand-dot">.</span></span><span class="brand-caption">ENTERTAINMENT</span></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="navigation" hidden><span class="menu-label">MENU</span><span class="menu-lines" aria-hidden="true"></span></button>
    <nav id="navigation" class="navigation" aria-label="メインナビゲーション">
      <a href="../#about">ABOUT</a><a href="../#services">SERVICES</a><a href="../#works">WORKS</a><a href="../#company">COMPANY</a>
      <a class="button button-small" href="../#contact">チャンネル無料診断 <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main class="report-shell">
    <div id="report-body" aria-live="polite">
      <p class="report-loading">診断レポートを読み込んでいます…</p>
    </div>
  </main>
  <footer class="site-footer wrap"><a class="brand" href="../" aria-label="PDY ENTERTAINMENT トップ"><span class="brand-mark">PDY<span class="brand-dot">.</span></span><span class="brand-caption">ENTERTAINMENT</span></a><p>株式会社PDYエンタテインメント</p><small>© PDY ENTERTAINMENT</small></footer>
  <script>
    (() => {
      const WORKER = 'https://pdy-script-generator.pdytokyo.workers.dev';
      const box = document.querySelector('#report-body');
      const params = new URLSearchParams(location.search);
      const token = (params.get('t') || location.hash.replace(/^#/, '')).trim();
      const isNew = params.get('new') === '1';
      const STAGE_TEXT = { queued: '順番待ち中…', fetching: 'チャンネルの公開データを取得しています…', metrics: '数字を整理しました。弱点を分析しています…', picks: '弱点を特定しました。企画を作成しています…', plan: '企画ができました。絵コンテを描いています…', images: '仕上げ中…' };
      const fail = (msg) => { box.innerHTML = `<p class="report-error">${msg}<br><a href="../#contact">もう一度診断を依頼する</a>／お急ぎの方は <a href="mailto:pdytokyo@gmail.com">pdytokyo@gmail.com</a> へ。</p>`; };
      if (!/^[A-Za-z0-9_-]{8,128}$/.test(token)) { fail('レポートのアドレスが正しくありません。メールに記載のリンクをそのまま開いてください。'); return; }
      let bar = null;
      const setProgress = (stage) => {
        if (stage === 'done') { if (bar) bar.remove(); bar = null; return; }
        if (!bar) { bar = document.createElement('div'); bar.className = 'report-progress'; box.parentNode.insertBefore(bar, box); }
        bar.innerHTML = `<span class="report-progress-dot"></span>${STAGE_TEXT[stage] || 'レポートを作成しています…'}<br><small>この画面のまま少しお待ちください（できた順に表示されます。完成したらメールでも同じリンクが届きます）</small>`;
      };
      let notFoundCount = 0, timer = null;
      const load = async () => {
        try {
          const res = await fetch(`${WORKER}/diag/${encodeURIComponent(token)}?format=fragment`, { headers: { Accept: 'text/html' }, cache: 'no-store' });
          const stage = res.headers.get('X-Diag-Stage') || (res.ok ? 'done' : '');
          if (res.status === 404 || res.status === 410) {
            // 送信直後は数秒だけ保存待ちがある
            if (isNew && notFoundCount++ < 12) { setProgress('queued'); timer = setTimeout(load, 5000); return; }
            return fail('このレポートは見つからないか、公開期限（60日）を過ぎています。');
          }
          if (!res.ok) { if (isNew && notFoundCount++ < 12) { setProgress('queued'); timer = setTimeout(load, 5000); return; } return fail('レポートを読み込めませんでした。時間を置いてもう一度お試しください。'); }
          const html = await res.text();
          if (html.trim()) { box.innerHTML = html; }
          document.title = (box.querySelector('h1')?.textContent || 'チャンネル診断レポート') + '｜PDY ENTERTAINMENT';
          setProgress(stage);
          if (stage !== 'done') timer = setTimeout(load, 6000);
        } catch { if (isNew && notFoundCount++ < 12) { timer = setTimeout(load, 6000); return; } fail('通信エラーで読み込めませんでした。'); }
      };
      if (isNew) setProgress('queued');
      load();
    })();
  </script>
</body>
</html>
